name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: openleetcode
          POSTGRES_USER: openleetcode
          POSTGRES_PASSWORD: openleetcode
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openleetcode -d openleetcode"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DB_URL: jdbc:postgresql://localhost:5432/openleetcode
      DB_USER: openleetcode
      DB_PASSWORD: openleetcode

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build