services:
  db:
    image: postgres:17-alpine
    container_name: openleetcode-db
    environment:
      POSTGRES_DB: openleetcode
      POSTGRES_USER: ${DB_USER:-openleetcode}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-openleetcode}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data: